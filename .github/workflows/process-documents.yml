name: Listenva Document Processor

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Process pending Listenva documents
        env:
          CRON_URL: "https://listenva.site.je/cron/process.php"
          CRON_SECRET: ${{ secrets.LISTENVA_CRON_SECRET }}
        run: |
          set -u

          echo "=== Diagnostic: basic outbound connectivity from this runner ==="
          curl -s -o /dev/null -w "google.com -> HTTP %{http_code}, %{time_total}s\n" --max-time 15 https://www.google.com || echo "google.com: curl failed"
          echo "--- verbose attempt to reach listenva.site.je ---"
          curl -sv --max-time 15 "https://listenva.site.je/" 2>&1 | tail -40
          echo "=== End diagnostic ==="
          echo ""

          echo "Starting Listenva processing loop..."
          END_TIME=$((SECONDS + 25*60))
          CONSECUTIVE_EMPTY=0

          while [ "$SECONDS" -lt "$END_TIME" ]; do
            RESPONSE=$(curl -s --max-time 90 "${CRON_URL}?key=${CRON_SECRET}" 2>&1)
            CURL_EXIT=$?
            if [ $CURL_EXIT -ne 0 ]; then
              RESPONSE="(curl exit code ${CURL_EXIT}: ${RESPONSE})"
            fi
            echo "$RESPONSE"

            if echo "$RESPONSE" | grep -q "Nothing to process"; then
              CONSECUTIVE_EMPTY=$((CONSECUTIVE_EMPTY + 1))
              if [ "$CONSECUTIVE_EMPTY" -ge 3 ]; then
                echo "Nothing to process for 3 checks in a row — exiting early to save Actions minutes."
                exit 0
              fi
              sleep 20
            else
              CONSECUTIVE_EMPTY=0
              sleep 3
            fi
          done

          echo "Reached this run's time budget. The next scheduled run (within 10 minutes) will continue."
